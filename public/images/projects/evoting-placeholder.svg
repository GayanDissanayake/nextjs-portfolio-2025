<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evotingTitle">
  <title id="evotingTitle">eVoting System — architecture preview graphic</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#083344"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="ballotFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- decorative grid dots -->
  <g fill="#67e8f9" opacity="0.15">
    <circle cx="60" cy="60" r="3"/>
    <circle cx="740" cy="60" r="3"/>
    <circle cx="60" cy="540" r="3"/>
    <circle cx="740" cy="540" r="3"/>
    <circle cx="400" cy="60" r="3"/>
    <circle cx="400" cy="540" r="3"/>
  </g>

  <!-- ballot box -->
  <g transform="translate(300,190)">
    <rect x="0" y="70" width="200" height="140" rx="10" fill="#0e293a" stroke="#22d3ee" stroke-width="3"/>
    <path d="M0 110 L100 60 L200 110 Z" fill="#155e75" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round"/>
    <rect x="70" y="55" width="60" height="14" rx="4" fill="#0e293a" stroke="#22d3ee" stroke-width="3"/>

    <!-- ballot slip going into slot -->
    <g transform="translate(75,-40)">
      <rect x="0" y="0" width="50" height="66" rx="4" fill="url(#ballotFill)"/>
      <path d="M12 34 L21 43 L40 20" stroke="#083344" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- lock badge (security) -->
  <g transform="translate(520,150)">
    <circle cx="0" cy="0" r="42" fill="#0e293a" stroke="#fbbf24" stroke-width="3"/>
    <rect x="-16" y="-4" width="32" height="26" rx="5" fill="#fbbf24"/>
    <path d="M-10 -4 V-14 a10 10 0 0 1 20 0 V-4" stroke="#fbbf24" stroke-width="5" fill="none"/>
  </g>

  <!-- cloud / serverless badge -->
  <g transform="translate(230,140)">
    <circle cx="0" cy="0" r="34" fill="#0e293a" stroke="#67e8f9" stroke-width="3"/>
    <path d="M-16 6 a10 10 0 0 1 2 -19.8 a13 13 0 0 1 25 3.8 a9 9 0 0 1 -2 15.9 z" fill="#67e8f9"/>
  </g>

  <text x="400" y="470" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="30" fill="#ecfeff" font-weight="700">eVoting System</text>
  <text x="400" y="504" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#67e8f9">Next.js · AWS Lambda · DynamoDB · SQS · Cognito</text>
</svg>
